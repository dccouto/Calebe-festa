#   npx wrangler secret put ORDS_PROXY_TARGET
#   npx wrangler secret put CORS_ALLOW_ORIGINS
#   npx wrangler deploy
#
# Espelha PipocaGourmet (pope-ords-proxy).

name = "calebe-ords-proxy"
